[project]
name = "a2a-sample-agent"
version = "0.1.0"
description = "Example agent for the Agent2Agent framework using LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk==0.2.8",
    "click>=8.1.8",
    "httpx>=0.28.1",
    "langchain>=0.3.26",
    "langchain-ollama>=0.3.3",
    "langchain-anthropic>=0.3.8",
    "langgraph>=0.5.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.1.1",
    "uvicorn>=0.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["application"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
